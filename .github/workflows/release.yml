name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential cmake ninja-build qt6-base-dev qt6-qpa-plugins dpkg-dev python3 file
      - uses: actions/checkout@v4
      - name: Build and test on the oldest supported OS
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DPI_CONTROL_PACKAGE=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s distribution/tests -v
          cd build
          cpack
      - name: Validate release version and generate checksum manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 distribution/manifest.py build/pi-control_*_arm64.deb "$RELEASE_TAG" > build/pi-control-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/pi-control_*_arm64.deb
            build/pi-control-manifest.json
            distribution/install.sh
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes build/*.deb build/pi-control-manifest.json distribution/install.sh
